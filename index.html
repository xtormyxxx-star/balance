<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부캐 vs 본캐 밸런스 게임</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 한 화면 게임. 상단 줄다리기 게이지 → 라운드 카드 2장(A/B) → 결과 카드 */
:root{
  --night:#0d1b3d; --panel:#16285a; --line:#2b4384;
  --ink:#eef3ff; --muted:#9fb1dc;
  --virtual:#a46bff; --real:#3fb5ff; --gold:#ffcf4a;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --soft:"Gowun Dodum","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(circle at 12% 0%,rgba(164,107,255,.18),transparent 45%),radial-gradient(circle at 90% 100%,rgba(63,181,255,.16),transparent 45%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}

/* 시작 */
.intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 8px 20px}
.badge{font-size:12px;letter-spacing:.12em;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:4px 12px}
.intro h1{font-size:clamp(34px,8vw,64px);line-height:1.1}
.intro h1 .v{color:var(--virtual)} .intro h1 .r{color:var(--real)}
.intro p{color:var(--muted);max-width:30em;margin:0}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:640px;width:100%;margin-top:6px}
.rules div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.rules b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
@media(max-width:560px){.rules{grid-template-columns:1fr}}
.cta{font-family:var(--display);font-size:22px;background:var(--gold);color:var(--night);border:0;border-radius:16px;padding:14px 40px;box-shadow:0 6px 0 #c99a16;transition:transform .1s}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #c99a16}

/* HUD */
.hud{display:flex;flex-direction:column;gap:10px}
.hudtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.roundno{font-family:var(--display);font-size:22px}
.roundno span{color:var(--gold)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:14px;height:8px;border-radius:4px;background:var(--line)}
.dots i.a{background:var(--virtual)} .dots i.b{background:var(--real)} .dots i.now{background:var(--gold)}
.tug{position:relative;height:34px;border-radius:17px;background:linear-gradient(90deg,var(--virtual),#5a4fb0 45%,#2f6fb8 55%,var(--real));overflow:hidden;border:2px solid var(--line)}
.tug .lbl{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;letter-spacing:.06em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.tug .l{left:14px} .tug .rr{right:14px}
.knot{position:absolute;top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 4px rgba(255,207,74,.3);transition:left .6s cubic-bezier(.3,1.6,.5,1)}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left}
.timer.low i{background:#ff6b6b}

/* 라운드 */
.theme{text-align:center;display:flex;flex-direction:column;gap:4px}
.theme small{color:var(--gold);letter-spacing:.14em;font-size:12px;font-weight:700}
.theme h2{font-size:clamp(26px,5.5vw,38px)}
.theme p{color:var(--muted);margin:0;font-family:var(--soft)}
.arena{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:stretch}
.vs{align-self:center;font-family:var(--display);font-size:26px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--night);border:3px solid var(--gold);color:var(--gold)}
@media(max-width:640px){.arena{grid-template-columns:1fr}.vs{justify-self:center;width:46px;height:46px;font-size:20px;margin:-6px 0}}
.card{position:relative;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .2s,border-color .2s,opacity .3s,box-shadow .2s}
.card:hover:not([disabled]){transform:translateY(-4px)}
.card.A:hover:not([disabled]){border-color:var(--virtual);box-shadow:0 10px 30px -10px var(--virtual)}
.card.B:hover:not([disabled]){border-color:var(--real);box-shadow:0 10px 30px -10px var(--real)}
.card[disabled]{cursor:default}
.card.picked.A{border-color:var(--virtual);box-shadow:0 0 0 4px rgba(164,107,255,.25)}
.card.picked.B{border-color:var(--real);box-shadow:0 0 0 4px rgba(63,181,255,.25)}
.card.dim{opacity:.38;transform:scale(.97)}
.tag{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;color:#fff}
.A .pill{background:var(--virtual)} .B .pill{background:var(--real);color:var(--night)}
.key{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.art{height:110px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.04)}
.art svg{height:96px;width:auto}
.sub{font-size:13px;color:var(--muted)}
.main{font-size:17px;font-weight:700;line-height:1.5;word-break:keep-all}
.note{font-size:12px;color:var(--muted)}
.stamp{position:absolute;top:12px;right:12px;font-family:var(--display);font-size:15px;color:var(--gold);border:2px solid var(--gold);border-radius:8px;padding:2px 8px;transform:rotate(8deg)}

.feedback{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;animation:pop .35s ease-out}
.feedback p{margin:0;flex:1 1 280px;font-family:var(--soft);font-size:15px}
.feedback b{color:var(--gold)}
.next{font-weight:700;background:var(--gold);color:var(--night);border:0;border-radius:12px;padding:10px 22px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:0}
@keyframes pop{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}

/* 결과 */
.result{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;padding-top:10px}
.result .kicker{color:var(--gold);letter-spacing:.14em;font-size:12px;font-weight:700}
.result h1{font-size:clamp(32px,7vw,54px)}
.result .desc{font-family:var(--soft);max-width:34em;color:var(--ink);margin:0;font-size:16px}
.score{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.score div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 18px;min-width:120px}
.score b{display:block;font-family:var(--display);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums}
.score .sa b{color:var(--virtual)} .score .sb b{color:var(--real)}
.recap{width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px;text-align:left}
.recap div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.recap em{font-style:normal;color:var(--muted);font-size:12px;white-space:nowrap}
.scale{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;word-break:keep-all}
.scale b{color:var(--ink);font-size:13px;line-height:1.3}
.scale .me{border:2px solid var(--gold);background:#2a3360}
.scale .me b{color:var(--gold)}
@media(max-width:560px){.scale{grid-template-columns:1fr}}
.mission{max-width:640px;width:100%;border:2px dashed var(--gold);border-radius:16px;padding:16px;text-align:left}
.mission strong{color:var(--gold);display:block;margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{background:transparent;border:2px solid var(--line);border-radius:12px;padding:10px 20px;font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  {theme:"자연과 화면", q:"하늘이 유난히 예쁜 날!", bonus:true,
   A:{sub:"화면 속 풍경", main:"방 안에서 4K 고화질 풍경 영상으로 '힐링' 하기", note:"선명하지만 바람은 없음", icon:"screen"},
   B:{sub:"진짜 풍경", main:"밖으로 나가 동네를 20분 걷고 하늘 사진 한 장 찍어 오기", note:"햇볕과 바람이 함께", icon:"walk"},
   fA:"영상도 쉼이 되지만 <b>햇볕과 바람</b>은 화면으로 전해지지 않아요.",
   fB:"20분 산책만으로도 <b>기분을 바꾸는 효과</b>가 있어요."}
];

const TYPES = [ // 본캐(B) 선택 비율 기준, 위에서부터 판정
  {min:.85, range:"85% 이상", name:"단단한 본캐 마스터", desc:"화면 밖의 나를 아끼는 감각이 단단해요. 그렇다고 가상 세계를 멀리할 필요는 없어요. 지금처럼 내가 고르고, 내가 즐기면 충분해요.", mission:"친구 1명을 본캐 세계로 초대하기 (같이 산책, 운동, 수다 무엇이든 좋아요)"},
  {min:.6, range:"60~84%", name:"본캐 지킴이", desc:"대부분 현실의 나를 골랐고, 가상 세계의 재미도 솔직하게 인정했어요. 내가 어디에 끌리는지 아는 것 자체가 큰 힘이에요.", mission:"부캐를 골랐던 상황 하나를 골라 이번 주에 한 번만 B로 해 보기"},
  {min:.4, range:"40~59%", name:"균형 잡힌 듀얼 플레이어", desc:"두 세계를 모두 즐길 줄 아는 사람이에요. 여기서 본캐 쪽으로 딱 한 칸만 옮겨 보면, 화면 밖에도 재미있는 게 생각보다 많다는 걸 발견하게 될 거예요.", mission:"하루 30분 '폰 쉬는 시간'을 정하고, 그 시간에 하고 싶었던 일 하나 해 보기"},
  {min:.15, range:"15~39%", name:"부캐 몰입러", desc:"가상 세계에서 재미와 위로를 잘 찾는 사람이에요. 다만 오늘 선택을 보면 화면 밖의 본캐가 조금 심심해하고 있을지도 몰라요. 좋아하는 건 그대로 두고, 하루에 한 번은 본캐에게도 시간을 내어 줘 볼까요?", mission:"이번 주 3일, 30분씩 폰을 다른 방에 두고 하고 싶었던 활동 해 보기"},
  {min:0, range:"15% 미만", name:"가상 세계 탐험가", desc:"가상 세계를 누구보다 잘 아는 탐험가예요. 솔직하게 고른 것도 멋져요. 그런데 화면 속 지도는 넓은데, 현실 세계 지도는 아직 빈칸이 많아 보여요. 몸과 마음이 진짜로 충전되는 곳은 화면 밖일 때가 많아요. 오늘부터 한 칸씩 채워 봐요.", mission:"일주일 동안 매일 20분, 폰 없이 밖에 나가 걷거나 몸을 움직여 보기"}
];

const LIMIT = 15;
let L = ROUNDS;
let state = {i:0, picks:[], locked:false};
let timerId = null, tLeft = LIMIT;
const app = document.getElementById("app");

function intro(){
  stopTimer();
  state = {i:0, picks:[], locked:false};
  app.innerHTML = `
  <section class="intro">
    <span class="badge">디지털 웰빙 밸런스 게임</span>
    <h1><span class="v">부캐</span> vs <span class="r">본캐</span></h1>
    <p>가상 세계의 나와 현실 세계의 나, 매 라운드 하나만 고를 수 있어요. 선택할 때마다 줄다리기 매듭이 움직여요.</p>
    <div class="rules">
      <div><b>상황 15개</b>A(가상) 또는 B(현실) 중 하나</div>
      <div><b>15초 타이머</b>길게 고민하지 말고 직감으로</div>
      <div><b>결과 유형 + 미션</b>마지막에 나의 캐릭터 공개</div>
    </div>
    <div class="row"><button class="cta" id="start">전체 15라운드</button><button class="ghost" id="quick">빠른 5라운드 (랜덤)</button></div>
    <p class="hint">키보드: A / B 또는 ← / →</p>
  </section>`;
  document.getElementById("start").onclick = ()=>{ L = ROUNDS; round(); };
  document.getElementById("quick").onclick = ()=>{ L = [...ROUNDS].sort(()=>Math.random()-.5).slice(0,5); round(); };
}

function pos(){ // -100(부캐) ~ +100(본캐)
  const n = state.picks.length; if(!n) return 0;
  const b = state.picks.filter(p=>p==="B").length;
  return ((b - (n-b)) / L.length) * 100;
}

function hud(){
  const dots = L.map((_,k)=>{
    const p = state.picks[k];
    return `<i class="${p==="A"?"a":p==="B"?"b":k===state.i?"now":""}"></i>`;
  }).join("");
  const left = 50 + pos()*0.44;
  return `<div class="hud">
    <div class="hudtop"><div class="roundno">ROUND <span>${Math.min(state.i+1,L.length)}</span> / ${L.length}</div><div class="dots">${dots}</div></div>
    <div class="tug" aria-label="부캐와 본캐 줄다리기"><span class="lbl l">부캐 (가상)</span><span class="lbl rr">본캐 (현실)</span><div class="knot" id="knot" style="left:${left}%"></div></div>
  </div>`;
}

function card(side, o){
  return `<button class="card ${side}" data-side="${side}" id="card${side}">
    <div class="tag"><span class="pill">선택 ${side} · ${side==="A"?"가상 세계 / 부캐":"현실 세계 / 본캐"}</span><span class="key">${side}</span></div>
    <div class="art">${ICON[o.icon]}</div>
    <div class="sub">${o.sub}</div>
    <div class="main">${o.main}</div>
    <div class="note">${o.note}</div>
  </button>`;
}

function round(){
  const r = L[state.i];
  state.locked = false;
  app.innerHTML = hud() + `
    <div class="timer" id="timer"><i id="bar"></i></div>
    <div class="theme"><small>ROUND ${state.i+1} · ${r.theme}</small><h2>${r.q}</h2></div>
    <div class="arena">${card("A",r.A)}<div class="vs">VS</div>${card("B",r.B)}</div>
    <div id="fb"></div>`;
  app.querySelectorAll(".card").forEach(c=>c.onclick=()=>pick(c.dataset.side));
  startTimer();
}

function startTimer(){
  stopTimer(); tLeft = LIMIT;
  const bar = document.getElementById("bar"), t = document.getElementById("timer");
  bar.style.transform = "scaleX(1)";
  timerId = setInterval(()=>{
    tLeft -= .1;
    bar.style.transform = `scaleX(${Math.max(tLeft,0)/LIMIT})`;
    if(tLeft < 5) t.classList.add("low");
    if(tLeft <= 0){ stopTimer();
      const fb = document.getElementById("fb");
      if(fb && !state.locked) fb.innerHTML = `<p class="hint">⏱ 시간 초과! 그만큼 고민되는 질문이죠. 그래도 하나만 골라 주세요.</p>`;
    }
  },100);
}
function stopTimer(){ if(timerId){clearInterval(timerId); timerId=null;} }

function pick(side){
  if(state.locked) return;
  state.locked = true; stopTimer();
  state.picks[state.i] = side;
  const r = L[state.i];
  const me = document.getElementById("card"+side), other = document.getElementById("card"+(side==="A"?"B":"A"));
  me.classList.add("picked"); other.classList.add("dim");
  me.insertAdjacentHTML("beforeend",`<span class="stamp">PICK!</span>`);
  app.querySelectorAll(".card").forEach(c=>c.disabled=true);
  document.getElementById("knot").style.left = (50 + pos()*0.44) + "%";
  const last = state.i === L.length-1;
  document.getElementById("fb").innerHTML = `<div class="feedback"><p>${side==="A"?r.fA:r.fB}</p><button class="next" id="next">${last?"결과 보기":"다음 라운드"} →</button></div>`;
  const nx = document.getElementById("next"); nx.focus();
  nx.onclick = ()=>{ state.i++; last ? result() : round(); };
}

function result(){
  stopTimer();
  const b = state.picks.filter(p=>p==="B").length, a = L.length - b;
  const t = TYPES.find(x=>b/L.length>=x.min);
  const recap = L.map((r,k)=>{
    const p = state.picks[k], o = r[p];
    return `<div><span class="pill" style="background:var(${p==="A"?"--virtual":"--real"});color:${p==="A"?"#fff":"var(--night)"}">${p}</span><span>${o.main}</span><em>${r.theme}</em></div>`;
  }).join("");
  app.innerHTML = hud().replace(/ROUND <span>\d+<\/span>/,"FINAL <span>RESULT</span>") + `
  <section class="result">
    <span class="kicker">나의 캐릭터 유형</span>
    <h1>${t.name}</h1>
    <p class="desc">${t.desc}</p>
    <div class="score"><div class="sa"><b>${a}</b>부캐 선택</div><div class="sb"><b>${b}</b>본캐 선택</div><div><b>${Math.round(b/L.length*100)}%</b>본캐 비율</div></div>
    <div class="scale">${[...TYPES].reverse().map(x=>`<div class="${x===t?"me":""}"><b>${x.name}</b><span>본캐 ${x.range}</span></div>`).join("")}</div>
    <div class="recap">${recap}</div>
    <div class="mission"><strong>🎯 이번 주 본캐 레벨업 미션</strong>${t.mission}</div>
    <div class="row"><button class="cta" id="again">다시 하기</button></div>
  </section>`;
  document.getElementById("again").onclick = intro;
}

document.addEventListener("keydown",e=>{
  if(!document.getElementById("cardA")) return;
  const k = e.key.toLowerCase();
  if(k==="a"||e.key==="ArrowLeft") pick("A");
  if(k==="b"||e.key==="ArrowRight") pick("B");
});

intro();
</script>
</body>
</html>
